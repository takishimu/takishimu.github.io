         let currentNovelIndex = 0;

        // 2026年の小説を月ごとに収納して表示
        function renderYear2026() {
            const container = document.getElementById('year_2026');
            container.innerHTML = '';

            const year2026Novels = novels.filter(n => n.year === "2026");

            // 月ごとにグループ化
            const novelsByMonth = {};
            year2026Novels.forEach(novel => {
                const month = novel.month || "01";
                if (!novelsByMonth[month]) novelsByMonth[month] = [];
                novelsByMonth[month].push(novel);
            });

            Object.keys(novelsByMonth).sort().forEach(month => {
                const monthNovels = novelsByMonth[month];
                const monthNum = parseInt(month);

                // 月ヘッダー
                const monthHeader = document.createElement('div');
                monthHeader.className = 'month-header';
                monthHeader.innerHTML = `${monthNames[monthNum-1]} <span id="arrow2026${month}">▼</span>`;
                monthHeader.onclick = () => toggleMonth('2026', month);
                container.appendChild(monthHeader);

                // 月コンテンツ
                const monthContent = document.createElement('div');
                monthContent.className = 'month-content';
                monthContent.id = `month2026${month}Content`;

                const novelList = document.createElement('div');
                novelList.className = 'novel-list';

                monthNovels.forEach(novel => {
                    const item = document.createElement('div');
                    item.className = 'novel-item';

                    const link = document.createElement('a');
                    link.href = "#";
                    link.textContent = novel.title;
                    link.onclick = (e) => { 
                        e.preventDefault(); 
                        showNovel(novels.indexOf(novel)); 
                    };

                    const synopsisDiv = document.createElement('div');
                    synopsisDiv.className = 'synopsis-preview';
                    synopsisDiv.innerHTML = (novel.synopsis || 'あらすじは準備中です。').replace(/\n/g, '<br>');

                    item.appendChild(link);
                    item.appendChild(synopsisDiv);
                    novelList.appendChild(item);
                });

                monthContent.appendChild(novelList);
                container.appendChild(monthContent);
            });
        }

        function toggleYear(year) {
            if (year === '2026') {
                const content = document.getElementById('year_2026');
                const arrow = document.getElementById('arrow_2026');
                if (content) {
                    content.classList.toggle('active');
                    arrow.textContent = content.classList.contains('active') ? '▲' : '▼';
                }
            }
        }

        function toggleMonth(year, month) {
            const content = document.getElementById(`month${year}${month}Content`);

            if (content) {
                content.classList.toggle('active');
                arrow.textContent = content.classList.contains('active') ? '▲' : '▼';
            }
        }
