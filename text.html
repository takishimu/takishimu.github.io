<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名前変換 - 夢小説名前変換サイト</title>
    <style>
        body {
            font-family: "メイリオ", sans-serif;
            background: #f8f0f8;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .left-sidebar {
            flex: 1;
            min-width: 380px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .preview-area {
            flex: 2;
            min-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; color: #8b008b; margin-bottom: 10px; }
        h2 { color: #8b008b; margin-top: 0; border-bottom: 2px solid #ddd; padding-bottom: 8px; }

        .year-header, .month-header {
            font-size: 18px;
            font-weight: bold;
            color: #8b008b;
            padding: 12px 15px;
            background: #f9e8f9;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .year-header:hover, .month-header:hover { background: #f0d0f0; }

        .year-content, .month-content {
            display: none;
            padding-left: 15px;
            margin-bottom: 15px;
        }
        .year-content.active, .month-content.active {
            display: block;
        }

        .novel-item {
            margin-bottom: 18px;
        }
        .novel-list a {
            display: block;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            border: 2px solid #8b008b;
            background: #8b008b;
            transition: all 0.3s ease;
        }
        .novel-list a:hover {
            background: #c026d3 !important;
            border-color: #c026d3 !important;
            transform: translateX(6px);
            box-shadow: 0 6px 12px rgba(192, 38, 211, 0.5);
        }
        .novel-list a.active {
            background: #6b006b;
            border-color: #6b006b;
        }

        .synopsis-preview {
            font-size: 14px;
            color: #555;
            padding: 0 12px 8px 12px;
            line-height: 1.5;
            border-left: 4px solid #d8a8d8;
        }

        label { display: block; margin: 12px 0 5px; font-weight: bold; }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #8b008b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #a020f0; }

        .novel {
            white-space: pre-wrap;
            font-size: 16px;
            background: #fffaf0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            min-height: 400px;
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <h1>名前変換</h1>
    <p style="text-align:center;">小説のタイトルをクリックして名前を変換できます</p>

  
    <div class="container">
        <div class="left-sidebar">
            <h2>📅 年別一覧</h2>
            
            <!-- 2023〜2025年：別ページへのリンク -->
            <div class="year-header">
                <a href="2023_name.html" style="color:#8b008b; text-decoration:none; flex:1;">2023年</a>
            </div>
            <div class="year-header">
                <a href="2024_name.html" style="color:#8b008b; text-decoration:none; flex:1;">2024年</a>
            </div>
            <div class="year-header">
                <a href="2025_name.html" style="color:#8b008b; text-decoration:none; flex:1;">2025年</a>
            </div>

            <!-- 2026年：同ページ内で表示 -->
            <div class="year-header" onclick="toggleYear('2026')">2026年 <span id="arrow_2026">▼</span></div>
            <div class="year-content" id="year_2026"></div>
            
            
            <h2 style="margin-top:30px;">👤 名前入力</h2>
            <label>女主人公・名前</label>
            <input type="text" id="name1" placeholder="例: 名前" value="名前">

            <label>女主人公・苗字</label>
            <input type="text" id="name2" placeholder="例: 苗字" value="苗字">

            <label>男主人公・名前</label>
            <input type="text" id="name3" placeholder="例: ナマエ" value="ナマエ">

            <label>男主人公・苗字</label>
            <input type="text" id="name4" placeholder="例: ミョウジ" value="ミョウジ">
            
            <label>（3Pの時に使用）二人目の男主人公・名前</label>
            <input type="text" id="name5" placeholder="例: name" value="name">

            <label>（3Pの時に使用）二人目の男主人公・苗字</label>
            <input type="text" id="name6" placeholder="例: family" value="family">

            <button onclick="convertNovel()">変換して表示</button>
            <button onclick="clearAll()" style="background:#555; margin-left:10px;">クリア</button>
        </div>

        <div class="preview-area">
            <h2 id="currentTitle">小説本文</h2>
            <div id="result" class="novel">
                2026年の小説タイトルをクリックすると、ここに本文が表示されます。
            </div>
        </div>
    </div>

    <!-- パスワード画面 -->
    <div id="passwordScreen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: white; padding: 40px; border-radius: 12px; text-align: center; max-width: 380px; width: 90%;">
            <h2 id="passwordTitle">この小説を表示するには<br>パスワードを入力してください</h2>
            <input type="password" id="passwordInput" placeholder="パスワード" style="width:100%; padding:12px; margin:15px 0; font-size:18px;">
            <button onclick="checkPassword()" style="width:100%; padding:12px;">表示する</button>
            <div id="passwordError" style="color:red; margin-top:10px;"></div>
        </div>
    </div>

    <!-- 2026年用の小説データ -->
    <script src="2023_novels-data.js"></script>

    <script>
        let novels = window.novelsData || [];

        // 2026年の小説のみ同ページで表示
        function renderYear2026() {
            const container = document.getElementById('year_2026');
            container.innerHTML = '';

            const year2026Novels = novels.filter(n => n.year === "2026");

            const novelList = document.createElement('div');
            novelList.className = 'novel-list';

            year2026Novels.forEach(novel => {
                const item = document.createElement('div');
                item.className = 'novel-item';

                const link = document.createElement('a');
                link.href = "#";
                link.textContent = novel.title;
                link.onclick = (e) => { 
                    e.preventDefault(); 
                    showNovel(novels.indexOf(novel)); 
                };

                const synopsisDiv = document.createElement('div');
                synopsisDiv.className = 'synopsis-preview';
                synopsisDiv.innerHTML = (novel.synopsis || 'あらすじは準備中です。').replace(/\n/g, '<br>');

                item.appendChild(link);
                item.appendChild(synopsisDiv);
                novelList.appendChild(item);
            });

            container.appendChild(novelList);
        }

        function toggleYear(year) {
            if (year === '2026') {
                const content = document.getElementById('year_2026');
                const arrow = document.getElementById('arrow_2026');
                if (content) {
                    content.classList.toggle('active');
                    arrow.textContent = content.classList.contains('active') ? '▲' : '▼';
                }
            }
        }

        function showNovel(index) {
            const novel = novels[index];
            if (!novel) return;

            document.getElementById('currentTitle').textContent = novel.title;

            if (novel.password) {
                showPasswordForNovel(index);
                return;
            }

            document.getElementById('result').innerHTML = (novel.template || '').replace(/\n/g, '<br>');
        }

        function showPasswordForNovel(index) {
            const novel = novels[index];
            document.getElementById('passwordTitle').innerHTML = `${novel.title}<br>を表示するには<br>パスワードを入力してください`;
            document.getElementById('passwordScreen').style.display = 'flex';
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordError').textContent = '';
            window.pendingIndex = index;
        }

        function checkPassword() {
            const input = document.getElementById('passwordInput').value.trim();
            const novel = novels[window.pendingIndex];
            if (input === novel.password) {
                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('result').innerHTML = (novel.template || '').replace(/\n/g, '<br>');
            } else {
                document.getElementById('passwordError').textContent = "パスワードが違います";
            }
        }

        // 初期化
        window.onload = function() {
            renderYear2026();
            document.getElementById('arrow_2026').textContent = '▼';
        };
    </script>
</body>
</html>
