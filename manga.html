<head>

    <title>漫画連載</title>
    <style>
        body {
            font-family: "メイリオ", sans-serif;
            background: #f8f0f8;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .left-sidebar {
            flex: 1;
            min-width: 380px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .preview-area {
            flex: 2;
            min-width: 400px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }

        h1 { text-align: center; color: #8b008b; margin-bottom: 15px; }
        h2 { color: #8b008b; margin-top: 0; border-bottom: 2px solid #ddd; padding-bottom: 8px; }

        .year-header, .month-header {
            font-size: 18px;
            font-weight: bold;
            color: #8b008b;
            padding: 12px 15px;
            background: #f9e8f9;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .year-header:hover, .month-header:hover { background: #f0d0f0; }

        .year-content, .month-content {
            display: none;
            padding-left: 15px;
            margin-bottom: 15px;
        }
        .year-content.active, .month-content.active {
            display: block;
        }

        .manga-viewer {
            text-align: center;
            background: #000;
            padding: 15px;
            border-radius: 8px;
            min-height: 600px;
            position: relative;
        }

        .manga-page {
            max-width: 100%;
            height: auto;
            border: 1px solid #444;
            border-radius: 4px;
        }

        .page-info {
            color: #fff;
            margin: 10px 0;
            font-size: 16px;
        }

        .nav-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .nav-buttons button {
            padding: 10px 20px;
            font-size: 16px;
            background: #8b008b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            min-width: 120px;
        }
        .nav-buttons button:hover {
            background: #c026d3;
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
        }

        /* パスワード画面 */
        #passwordScreen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1>漫画連載</h1>
    <p style="text-align:center;">月を選択するとパスワード入力画面が表示されます</p>

    <div class="container">
        <div class="left-sidebar">
            <h2>📅 年別一覧</h2>
            
            <div class="year-header" onclick="toggleYear('2023')">2023年 <span id="arrow2023">▼</span></div>
            <div class="year-content" id="year2023Content"></div>
            
            <div class="year-header" onclick="toggleYear('2024')">2024年 <span id="arrow2024">▼</span></div>
            <div class="year-content" id="year2024Content"></div>
            
            <div class="year-header" onclick="toggleYear('2025')">2025年 <span id="arrow2025">▼</span></div>
            <div class="year-content" id="year2025Content"></div>

            <div class="year-header" onclick="toggleYear('2026')">2026年 <span id="arrow2026">▼</span></div>
            <div class="year-content" id="year2026Content"></div>
        </div>

        <div class="preview-area">
            <h2 id="currentTitle">漫画閲覧エリア</h2>
            <div class="manga-viewer" id="mangaViewer">
                <p style="color:#aaa; padding-top:200px;">月を選択して漫画を読んでください</p>
            </div>

            <div class="back-link">
                <a href="index.html">← ホームページに戻る</a>
            </div>
        </div>
    </div>

    <!-- パスワード画面 -->
    <div id="passwordScreen">

            <div id="passwordError" style="color:red; margin-top:10px; min-height:24px;"></div>
        </div>

        let currentManga = null;

        const monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

        function renderYearList(year) {
            const container = document.getElementById('year' + year + 'Content');
            container.innerHTML = '';

            // あらすじ表示
            let synopsis = '';
            if (year === "2023") synopsis = synopsis2023;
            if (year === "2024") synopsis = synopsis2024;
            if (year === "2025") synopsis = synopsis2025;
            if (year === "2026") synopsis = synopsis2026;

            if (synopsis) {
                const synopsisDiv = document.createElement('div');
                synopsisDiv.style.cssText = 'padding: 15px 12px; color:#555; background:#f9f0f9; border-radius:8px; margin-bottom:15px; border-left:5px solid #8b008b;';
                synopsisDiv.innerHTML = synopsis;
                container.appendChild(synopsisDiv);
            }

            // 月一覧
            let startMonth = (year === "2023") ? 2 : 1;
            for (let m = startMonth; m <= 12; m++) {
                const monthStr = m.toString().padStart(2, '0');
                const monthHeader = document.createElement('div');
                monthHeader.className = 'month-header';
                monthHeader.innerHTML = `${monthNames[m-1]} <span>→</span>`;
                monthHeader.onclick = () => showPasswordForYearMonth(year, monthStr);
                container.appendChild(monthHeader);
            }
        }

        function toggleYear(year) {
            const content = document.getElementById('year' + year + 'Content');
            const arrow = document.getElementById('arrow' + year);
            if (content) {
                content.classList.toggle('active');
                arrow.textContent = content.classList.contains('active') ? '▲' : '▼';
            }
        }

      function showPasswordForYearMonth(year, month) {
    // mangaListから該当する漫画を探す
    currentManga = mangaList.find(m => m.year === year && m.month === month);
    
    if (!currentManga) {
        // 未登録の月はエラー表示（デフォルトパスワードは使わない）
        alert(`${year}年${month}月号はまだ登録されていません。`);
        return;
    }
    
    openPasswordScreen();
}

        function openPasswordScreen() {
            document.getElementById('passwordTitle').innerHTML = 
                `${currentManga.title}<br>を表示するには<br>パスワードを入力してください`;
            document.getElementById('passwordScreen').style.display = 'flex';
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordError').textContent = '';
        }

       function checkPassword() {
    const input = document.getElementById('passwordInput').value.trim();
    if (!input) {
        document.getElementById('passwordError').textContent = "パスワードを入力してください";
        return;
    }

    // SHA-256ハッシュを計算
    const hash = CryptoJS.SHA256(input).toString(CryptoJS.enc.Hex);

    // ハッシュで比較
    currentManga = mangaList.find(m => m.passwordHash === hash);

    if (currentManga) {
        document.getElementById('passwordScreen').style.display = 'none';
        loadManga();
    } else {
        document.getElementById('passwordError').textContent = "パスワードが違います";
    }
}

        function loadManga() {
            currentPage = 0;
            document.getElementById('currentTitle').textContent = currentManga.title;
            showCurrentPage();
        }
        function showCurrentPage() {
            const viewer = document.getElementById('mangaViewer');
            if (!currentManga.pages || currentManga.pages.length === 0) {
                viewer.innerHTML = `<p style="color:white; padding:100px 20px;">この月の漫画はまだ準備中です。</p>`;
                return;
            }

            let buttons = '';

            // 最終ページ以外なら「次ページ」を左側に
            if (currentPage < currentManga.pages.length - 1) {
                buttons += `<button onclick="nextPage()">次ページ</button>`;
            } else {
                // 最終ページは右寄せにするために空の要素を入れる
                buttons += `<span style="flex:1;"></span>`;
            }

            // 1ページ目以外なら「前ページ」を右側に
            if (currentPage > 0) {
                buttons += `<button onclick="prevPage()">前ページ</button>`;
            }

            viewer.innerHTML = `
                <img src="${currentManga.pages[currentPage]}" class="manga-page" alt="ページ ${currentPage + 1}">
                <div class="page-info">${currentPage + 1} / ${currentManga.pages.length}</div>
                <div class="nav-buttons">
                    ${buttons}
                </div>
            `;
        }
        function nextPage() {
            if (currentPage < currentManga.pages.length - 1) {
                currentPage++;
                showCurrentPage();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                showCurrentPage();
            }
        }
