<head>
    <meta charset="UTF-8">

    <title>漫画連載</title>
    <style>
        body {
            font-family: "メイリオ", sans-serif;
            background: #f8f0f8;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .left-sidebar {
            flex: 1;
            min-width: 380px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .preview-area {
            flex: 2;
            min-width: 400px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }

        h1 { text-align: center; color: #8b008b; margin-bottom: 15px; }
        h2 { color: #8b008b; margin-top: 0; border-bottom: 2px solid #ddd; padding-bottom: 8px; }

        .year-header, .month-header {
            font-size: 18px;
            font-weight: bold;
            color: #8b008b;
            padding: 12px 15px;
            background: #f9e8f9;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .year-header:hover, .month-header:hover { background: #f0d0f0; }

        .year-content, .month-content {
            display: none;
            padding-left: 15px;
            margin-bottom: 15px;
        }
        .year-content.active, .month-content.active {
            display: block;
        }

        .manga-viewer {
            text-align: center;
            background: #000;
            padding: 15px;
            border-radius: 8px;
            min-height: 600px;
            position: relative;
        }

        .manga-page {
            max-width: 100%;
            height: auto;
            border: 1px solid #444;
            border-radius: 4px;
        }

        .page-info {
            color: #fff;
            margin: 10px 0;
            font-size: 16px;
        }

        .nav-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .nav-buttons button {
            padding: 10px 20px;
            font-size: 16px;
            background: #8b008b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            min-width: 120px;
        }
        .nav-buttons button:hover {
            background: #c026d3;
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
        }

        /* パスワード画面 */
        #passwordScreen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

    <h1>漫画連載</h1>
    <p style="text-align:center;">月を選択するとパスワード入力画面が表示されます</p>

    <div class="container">
        <div class="left-sidebar">
            <h2>📅 年別一覧</h2>
            
            <div class="year-header" onclick="toggleYear('2023')">2023年 <span id="arrow2023">▼</span></div>
            <div class="year-content" id="year2023Content"></div>
            
            <div class="year-header" onclick="toggleYear('2024')">2024年 <span id="arrow2024">▼</span></div>
            <div class="year-content" id="year2024Content"></div>
            
            <div class="year-header" onclick="toggleYear('2025')">2025年 <span id="arrow2025">▼</span></div>
            <div class="year-content" id="year2025Content"></div>

            <div class="year-header" onclick="toggleYear('2026')">2026年 <span id="arrow2026">▼</span></div>
            <div class="year-content" id="year2026Content"></div>
        </div>

        <div class="preview-area">
            <h2 id="currentTitle">漫画閲覧エリア</h2>
            <div class="manga-viewer" id="mangaViewer">
                <p style="color:#aaa; padding-top:200px;">月を選択して漫画を読んでください</p>
            </div>

            <div class="back-link">
                <a href="index.html">← ホームページに戻る</a>
            </div>
        </div>
    </div>

    <!-- パスワード画面 -->
    <div id="passwordScreen">
        <div style="background: white; padding: 40px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%;">
            <h2 id="passwordTitle">この話を表示するには<br>パスワードを入力してください</h2>

            <button onclick="checkPassword()"

            <div id="passwordError" style="color:red; margin-top:10px; min-height:24px;"></div>
        </div>
    </div>
