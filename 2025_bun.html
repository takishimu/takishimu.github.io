        const monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

        function renderYearList(year) {
            const container = document.getElementById('year' + year + 'Content');
            container.innerHTML = '';

            for (let m = 1; m <= 12; m++) {
                const monthStr = m.toString().padStart(2, '0');
                const monthNovels = novels.filter(n => n.year === year && n.month === monthStr);

                if (monthNovels.length === 0) continue;

                const monthHeader = document.createElement('div');
                monthHeader.className = 'month-header';
                monthHeader.innerHTML = `${monthNames[m-1]} <span id="arrow${year}${monthStr}">▼</span>`;
                monthHeader.onclick = () => toggleMonth(year, monthStr);
                container.appendChild(monthHeader);

                const monthContent = document.createElement('div');
                monthContent.className = 'month-content';
                monthContent.id = `month${year}${monthStr}Content`;

                const novelList = document.createElement('div');
                novelList.className = 'novel-list';

                monthNovels.forEach(novel => {
                    const idx = novels.findIndex(n => n.id === novel.id);
                    
                    const item = document.createElement('div');
                    item.className = 'novel-item';

                    const link = document.createElement('a');
                    link.href = "#";
                    link.textContent = novel.title;
                    link.onclick = (e) => {
                        e.preventDefault();
                        showPasswordForNovel(idx);

                    if (idx === currentNovelIndex) link.classList.add('active');

synopsis.className = 'synopsis-preview';
synopsis.innerHTML = (novel.synopsis || 'あらすじは準備中です。').replace(/\n/g, '<br>');

        function toggleYear(year) {

function checkPassword() {

    const input =
        document.getElementById('passwordInput')
        .value
        .trim();

    if (!input) {

        document.getElementById('passwordError')
            .textContent =
            "パスワードを入力してください";

        return;
    }

    const hash =
        CryptoJS.SHA256(input)
        .toString(CryptoJS.enc.Hex);

    const novel =
        novels[pendingNovelIndex];

    if (hash === novel.passwordHash) {

        currentNovelIndex =
            pendingNovelIndex;

        document.getElementById('passwordScreen')
            .style.display =
            'none';

        loadSelectedNovel();

    } else {

        document.getElementById('passwordError')
            .textContent =
            "パスワードが違います";
    }
}

      async function loadSelectedNovel() {

    console.log("currentNovelIndex=", currentNovelIndex);
    console.log("novels=", novels);

    const novel = novels[currentNovelIndex];

    console.log("novel=", novel);

    document.getElementById('currentTitle').innerHTML =
        `小説本文 <small style="font-size:14px;color:#666;">（${novel.title}）</small>`;

    try {

        const response =
            await fetch(novel.file);

        const encrypted =
            await response.text();

        const decrypted =
            CryptoJS.AES.decrypt(
                encrypted,
                "Takishimu_Novel_Master_Key_2026"
            ).toString(
                CryptoJS.enc.Utf8
            );

        document.getElementById('result').innerHTML =
            decrypted.replace(/\n/g, '<br>');

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    } catch (error) {

        console.log(novels);

        document.getElementById('result').innerHTML =
            "小説の読み込みに失敗しました";
    }
}
